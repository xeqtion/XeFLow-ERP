name: xeflow

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-erp}
      MYSQL_USER: ${MYSQL_USER:-xeflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/opt/xeflow/sql:ro
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./erp-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-erp}
      MYSQL_USER: ${MYSQL_USER:-xeflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:?set a 64-character ERP_JWT_SECRET in .env}
      ERP_BOOTSTRAP_ADMIN_ENABLED: "true"
      ERP_BOOTSTRAP_ADMIN_PASSWORD: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:?set a strong bootstrap admin password in .env}
      ERP_BOOTSTRAP_ADMIN_EMAIL: ${ERP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      ERP_CORS_ORIGINS: ${ERP_CORS_ORIGINS:-}
      ERP_COMPANY_NAME: ${ERP_COMPANY_NAME:-XeFlow Demo Company}
      ERP_COMPANY_ADDRESS_LINE_1: ${ERP_COMPANY_ADDRESS_LINE_1:-Configure your company address}
      ERP_COMPANY_ADDRESS_LINE_2: ${ERP_COMPANY_ADDRESS_LINE_2:-}
      ERP_COMPANY_WEBSITE: ${ERP_COMPANY_WEBSITE:-https://example.com}
      ERP_COMPANY_CONTACT: ${ERP_COMPANY_CONTACT:-Configure your company contact}
      ERP_COMPANY_SHIPPING_MARK: ${ERP_COMPANY_SHIPPING_MARK:-XeFlow}
      ERP_COMPANY_BANK_ACCOUNT_NAME: ${ERP_COMPANY_BANK_ACCOUNT_NAME:-}
      ERP_COMPANY_BANK_NAME: ${ERP_COMPANY_BANK_NAME:-}
      ERP_COMPANY_BANK_ACCOUNT_NO: ${ERP_COMPANY_BANK_ACCOUNT_NO:-}
      ERP_COMPANY_BANK_ADDRESS: ${ERP_COMPANY_BANK_ADDRESS:-}
      ERP_COMPANY_BANK_SWIFT_CODE: ${ERP_COMPANY_BANK_SWIFT_CODE:-}
      ERP_COMPANY_BANK_CURRENCY: ${ERP_COMPANY_BANK_CURRENCY:-USD}
      ERP_REGISTER_ENABLED: ${ERP_REGISTER_ENABLED:-false}
      ERP_REGISTER_DOMAINS: ${ERP_REGISTER_DOMAINS:-}
      ERP_REGISTER_REQUIRE_EMAIL_CODE: ${ERP_REGISTER_REQUIRE_EMAIL_CODE:-false}
      ERP_REGISTER_APPROVAL: ${ERP_REGISTER_APPROVAL:-true}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      ERP_MAIL_ENABLED: ${ERP_MAIL_ENABLED:-false}
      ERP_MAIL_FROM: ${ERP_MAIL_FROM:-XeFlow <noreply@example.com>}
      TZ: Asia/Shanghai
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./erp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"

volumes:
  mysql-data:
  redis-data:
  backend-uploads:
  backend-logs:
